name: vulkan
on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive

# The Vulkan feature extractors on lavapipe (Mesa's CPU Vulkan driver): every
# feature of every frame must be the same as the CPU feature extractors'.
jobs:
  vulkan-lavapipe:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install meson
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build nasm gcc g++ glslang-tools \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools ffmpeg
          vulkaninfo --summary || true
      - uses: actions/checkout@v7
      - name: Print the features with all digits (test builds only)
        run: |
          sed -i 's/%\.6f%s\\n/%.17g%s\\n/; s/%\.16f%s\\n/%.17g%s\\n/' libvmaf/src/output.c
      - name: Build (CPU)
        run: |
          meson setup libvmaf libvmaf/build-cpu --buildtype release -Denable_docs=false
          ninja -C libvmaf/build-cpu
      - name: Build (Vulkan)
        run: |
          meson setup libvmaf libvmaf/build-vulkan --buildtype release -Denable_docs=false -Denable_vulkan=true
          ninja -C libvmaf/build-vulkan
      - name: Run tests (Vulkan build)
        run: |
          meson test -C libvmaf/build-vulkan --print-errorlogs
      - name: Compare with the CPU
        run: |
          sh libvmaf/test/vulkan/compare.sh libvmaf/build-cpu/tools/vmaf \
            libvmaf/build-vulkan/tools/vmaf "$RUNNER_TEMP/vk"
      - name: Compare with the CPU (the other GPU paths)
        env:
          VMAF_VULKAN_SPEED_GPU: 1
          VMAF_VULKAN_CAMBI_SPLIT: 1
          VMAF_VULKAN_CAMBI_COLS: 0
          VMAF_VULKAN_CAMBI_LANES: 0
          VMAF_VULKAN_MOTION_SPLIT: 1
          VMAF_VULKAN_NO_ASYNC_UPLOAD: 1
        run: |
          sh libvmaf/test/vulkan/compare.sh libvmaf/build-cpu/tools/vmaf \
            libvmaf/build-vulkan/tools/vmaf "$RUNNER_TEMP/vk"
